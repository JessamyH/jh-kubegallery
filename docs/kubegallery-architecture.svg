<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1150" viewBox="0 0 1200 1150" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1200" height="1150" fill="#FFFFFF"/>

  <text x="60" y="56" font-size="26" font-weight="600" fill="#1F1E1D">JH KubeGallery</text>
  <text x="60" y="84" font-size="15" fill="#5F5E5A">Media processing and gallery web on Amazon EKS · Terraform layers · GitOps with Argo CD</text>

  <!-- Row 1 -->
  <rect x="60" y="110" width="250" height="80" rx="14" fill="#F1EFE8" stroke="#B4B2A9"/>
  <text x="84" y="143" font-size="18" font-weight="600" fill="#2C2C2A">GitHub Actions</text>
  <text x="84" y="168" font-size="14" fill="#5F5E5A">Build images · bump chart tag</text>

  <rect x="360" y="110" width="230" height="80" rx="14" fill="#E6F1FB" stroke="#378ADD"/>
  <text x="384" y="143" font-size="18" font-weight="600" fill="#0C447C">Amazon ECR</text>
  <text x="384" y="168" font-size="14" fill="#185FA5">Job + web images</text>
  <rect x="546" y="122" width="32" height="20" rx="10" fill="#378ADD"/>
  <text x="562" y="136" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">L1</text>

  <rect x="880" y="110" width="260" height="80" rx="14" fill="#F1EFE8" stroke="#B4B2A9"/>
  <text x="904" y="143" font-size="18" font-weight="600" fill="#2C2C2A">Terraform</text>
  <text x="904" y="168" font-size="14" fill="#5F5E5A">Applies L1 → L2 → L3</text>

  <!-- Row 2 -->
  <rect x="60" y="230" width="250" height="80" rx="14" fill="#E6F1FB" stroke="#378ADD"/>
  <text x="84" y="263" font-size="18" font-weight="600" fill="#0C447C">S3 raw</text>
  <text x="84" y="288" font-size="14" fill="#185FA5">Sample media (input)</text>
  <rect x="266" y="242" width="32" height="20" rx="10" fill="#378ADD"/>
  <text x="282" y="256" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">L1</text>

  <rect x="360" y="230" width="230" height="80" rx="14" fill="#F1EFE8" stroke="#B4B2A9"/>
  <text x="384" y="263" font-size="18" font-weight="600" fill="#2C2C2A">Git repo</text>
  <text x="384" y="288" font-size="14" fill="#5F5E5A">Helm charts (GitOps)</text>

  <rect x="667" y="230" width="200" height="80" rx="14" fill="#F1EFE8" stroke="#B4B2A9"/>
  <text x="691" y="263" font-size="18" font-weight="600" fill="#2C2C2A">Users</text>
  <text x="691" y="288" font-size="14" fill="#5F5E5A">Browser</text>

  <!-- VPC -->
  <rect x="60" y="360" width="1080" height="530" rx="20" fill="#FBFAFF" stroke="#7F77DD" stroke-width="1.4" stroke-dasharray="8 6"/>
  <text x="84" y="396" font-size="15" font-weight="600" fill="#3C3489">VPC  (L2)</text>

  <!-- Public subnets: right side only, so S3 and Git arrows do not pass through -->
  <rect x="640" y="372" width="480" height="108" rx="14" fill="#F4F3FE" stroke="#AFA9EC" stroke-dasharray="5 4"/>
  <text x="900" y="395" font-size="13" font-weight="600" fill="#534AB7">Public subnets · internet-facing</text>

  <rect x="667" y="404" width="200" height="60" rx="12" fill="#FAECE7" stroke="#D85A30"/>
  <text x="691" y="428" font-size="16" font-weight="600" fill="#712B13">ALB</text>
  <text x="691" y="449" font-size="13" fill="#993C1D">Created by Ingress</text>

  <rect x="900" y="404" width="200" height="60" rx="12" fill="#EEEDFE" stroke="#7F77DD"/>
  <text x="922" y="428" font-size="16" font-weight="600" fill="#3C3489">NAT gateway</text>
  <text x="922" y="449" font-size="13" fill="#534AB7">Outbound for nodes</text>

  <!-- EKS -->
  <rect x="90" y="496" width="1020" height="376" rx="18" fill="#EEEDFE" stroke="#7F77DD"/>
  <text x="512" y="522" font-size="13" font-weight="600" fill="#3C3489">Amazon EKS · worker nodes in private subnets  (L2)</text>

  <!-- Cluster row 1 -->
  <rect x="120" y="540" width="290" height="130" rx="14" fill="#FAECE7" stroke="#D85A30"/>
  <text x="144" y="576" font-size="19" font-weight="600" fill="#712B13">Media Job</text>
  <text x="144" y="600" font-size="14" fill="#993C1D">CronJob (suspended)</text>
  <text x="144" y="622" font-size="14" fill="#993C1D">Python + FFmpeg · Pod Identity</text>
  <text x="144" y="644" font-size="14" fill="#993C1D">Read raw · write processed</text>
  <rect x="352" y="552" width="46" height="20" rx="10" fill="#D85A30"/>
  <text x="375" y="566" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">App</text>

  <rect x="455" y="540" width="290" height="130" rx="14" fill="#E1F5EE" stroke="#1D9E75"/>
  <text x="479" y="576" font-size="19" font-weight="600" fill="#085041">Argo CD</text>
  <text x="479" y="608" font-size="14" fill="#0F6E56">Installed by Terraform</text>
  <text x="479" y="632" font-size="14" fill="#0F6E56">Syncs Helm charts from Git</text>
  <rect x="701" y="552" width="32" height="20" rx="10" fill="#1D9E75"/>
  <text x="717" y="566" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">L3</text>

  <rect x="790" y="540" width="290" height="130" rx="14" fill="#FAECE7" stroke="#D85A30"/>
  <text x="814" y="576" font-size="19" font-weight="600" fill="#712B13">Gallery Web</text>
  <text x="814" y="606" font-size="14" fill="#993C1D">Deployment + Service</text>
  <text x="814" y="630" font-size="14" fill="#993C1D">Exposed via Ingress → ALB</text>
  <text x="814" y="654" font-size="14" fill="#993C1D">Read-only S3 access</text>
  <rect x="1022" y="552" width="46" height="20" rx="10" fill="#D85A30"/>
  <text x="1045" y="566" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">App</text>

  <!-- Cluster row 2 -->
  <rect x="170" y="730" width="205" height="84" rx="12" fill="#FBFAFF" stroke="#7F77DD"/>
  <text x="188" y="762" font-size="16" font-weight="600" fill="#3C3489">Pod Identity agent</text>
  <text x="188" y="786" font-size="13" fill="#534AB7">AWS credentials for pods</text>

  <rect x="455" y="720" width="290" height="132" rx="14" fill="#FAECE7" stroke="#D85A30"/>
  <text x="479" y="754" font-size="19" font-weight="600" fill="#712B13">Observability</text>
  <text x="479" y="784" font-size="14" fill="#993C1D">Prometheus · kube-state-metrics</text>
  <text x="479" y="808" font-size="14" fill="#993C1D">Grafana · dashboards</text>
  <text x="479" y="832" font-size="14" fill="#993C1D">Alertmanager · alerts</text>
  <rect x="687" y="732" width="46" height="20" rx="10" fill="#D85A30"/>
  <text x="710" y="746" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">App</text>

  <rect x="830" y="730" width="205" height="84" rx="12" fill="#E1F5EE" stroke="#1D9E75"/>
  <text x="848" y="756" font-size="15" font-weight="600" fill="#085041">AWS Load Balancer</text>
  <text x="848" y="776" font-size="15" font-weight="600" fill="#085041">Controller</text>
  <text x="848" y="798" font-size="13" fill="#0F6E56">Creates ALB from Ingress</text>
  <rect x="993" y="760" width="32" height="20" rx="10" fill="#1D9E75"/>
  <text x="1009" y="774" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">L3</text>

  <!-- Bottom row -->
  <rect x="120" y="920" width="290" height="80" rx="14" fill="#E6F1FB" stroke="#378ADD"/>
  <text x="144" y="953" font-size="18" font-weight="600" fill="#0C447C">S3 processed</text>
  <text x="144" y="978" font-size="14" fill="#185FA5">Resized · metadata stripped</text>
  <rect x="366" y="932" width="32" height="20" rx="10" fill="#378ADD"/>
  <text x="382" y="946" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">L1</text>

  <rect x="455" y="920" width="290" height="80" rx="14" fill="#F1EFE8" stroke="#B4B2A9"/>
  <text x="479" y="953" font-size="18" font-weight="600" fill="#2C2C2A">Email</text>
  <text x="479" y="978" font-size="14" fill="#5F5E5A">Alert on job failure</text>

  <!-- Provisioning and deployment (dashed) -->
  <g fill="none" stroke="#5F5E5A" stroke-width="1.6" stroke-dasharray="6 5">
    <line x1="310" y1="150" x2="356" y2="150" marker-end="url(#ar)"/>
    <path d="M260 190 L260 210 L500 210 L500 226" marker-end="url(#ar)"/>
    <line x1="1010" y1="190" x2="1010" y2="354" marker-end="url(#ar)"/>
    <line x1="500" y1="310" x2="500" y2="536" marker-end="url(#ar)"/>
    <line x1="455" y1="605" x2="414" y2="605" marker-end="url(#ar)"/>
    <line x1="745" y1="605" x2="786" y2="605" marker-end="url(#ar)"/>
    <line x1="600" y1="670" x2="600" y2="716" marker-end="url(#ar)"/>
  </g>

  <!-- Data and traffic (solid) -->
  <g fill="none" stroke="#5F5E5A" stroke-width="1.6">
    <line x1="185" y1="310" x2="185" y2="536" marker-end="url(#ar)"/>
    <path d="M590 150 L620 150 L620 492" marker-end="url(#ar)"/>
    <line x1="767" y1="310" x2="767" y2="400" marker-end="url(#ar)"/>
    <line x1="840" y1="464" x2="840" y2="536" marker-end="url(#ar)"/>
    <line x1="1000" y1="496" x2="1000" y2="468" marker-end="url(#ar)"/>
    <line x1="150" y1="670" x2="150" y2="916" marker-end="url(#ar)"/>
    <path d="M395 670 L395 785 L451 785" marker-end="url(#ar)"/>
    <path d="M810 670 L810 785 L749 785" marker-end="url(#ar)"/>
    <line x1="600" y1="852" x2="600" y2="916" marker-end="url(#ar)"/>
    <path d="M265 1000 L265 1025 L1055 1025 L1055 674" marker-end="url(#ar)"/>
    <line x1="272" y1="730" x2="272" y2="674" marker-end="url(#ar)"/>
    <line x1="960" y1="730" x2="960" y2="674" marker-end="url(#ar)"/>
  </g>

  <!-- Arrow labels -->
  <g font-size="13" fill="#5F5E5A">
    <text x="320" y="204">update image tag</text>
    <text x="1022" y="280">provisions</text>
    <text x="510" y="440">syncs</text>
    <text x="628" y="346">image pull</text>
    <text x="401" y="776" font-size="12">scraped</text>
    <text x="755" y="776" font-size="12">scraped</text>
    <text x="840" y="1018">reads processed media</text>
    <text x="282" y="706">credentials</text>
    <text x="952" y="706" text-anchor="end">watches Ingress</text>
  </g>

  <!-- Legend -->
  <line x1="60" y1="1050" x2="1140" y2="1050" stroke="#E5E3DC"/>
  <rect x="60" y="1066" width="18" height="18" rx="5" fill="#E6F1FB" stroke="#378ADD"/>
  <text x="86" y="1080" font-size="14" fill="#2C2C2A"><tspan font-weight="600">L1</tspan> Foundation · S3, ECR, IAM</text>
  <rect x="290" y="1066" width="18" height="18" rx="5" fill="#EEEDFE" stroke="#7F77DD"/>
  <text x="316" y="1080" font-size="14" fill="#2C2C2A"><tspan font-weight="600">L2</tspan> Cluster · VPC, EKS</text>
  <rect x="480" y="1066" width="18" height="18" rx="5" fill="#E1F5EE" stroke="#1D9E75"/>
  <text x="506" y="1080" font-size="14" fill="#2C2C2A"><tspan font-weight="600">L3</tspan> Bootstrap · Argo CD, LB Controller</text>
  <rect x="770" y="1066" width="18" height="18" rx="5" fill="#FAECE7" stroke="#D85A30"/>
  <text x="796" y="1080" font-size="14" fill="#2C2C2A"><tspan font-weight="600">App</tspan> · deployed by Argo CD</text>
  <rect x="1010" y="1066" width="18" height="18" rx="5" fill="#F1EFE8" stroke="#B4B2A9"/>
  <text x="1036" y="1080" font-size="14" fill="#2C2C2A">External</text>

  <line x1="60" y1="1112" x2="102" y2="1112" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="112" y="1117" font-size="14" fill="#2C2C2A">Data and traffic</text>
  <line x1="290" y1="1112" x2="332" y2="1112" stroke="#5F5E5A" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#ar)"/>
  <text x="342" y="1117" font-size="14" fill="#2C2C2A">Provisioning and deployment</text>
</svg>
