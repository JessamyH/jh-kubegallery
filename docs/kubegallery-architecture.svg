  <text x="144" y="566" font-size="19" font-weight="600" fill="#712B13">Media Job</text>
  <text x="144" y="598" font-size="14" fill="#993C1D">Python + FFmpeg</text>
  <text x="144" y="622" font-size="14" fill="#993C1D">Image pulled from ECR</text>
  <text x="144" y="646" font-size="14" fill="#993C1D">EKS Pod Identity → S3</text>
  <rect x="352" y="542" width="46" height="20" rx="10" fill="#D85A30"/>
  <text x="375" y="556" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">App</text>

  <rect x="455" y="530" width="290" height="150" rx="14" fill="#E1F5EE" stroke="#1D9E75"/>
