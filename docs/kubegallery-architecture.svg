  <rect x="701" y="542" width="32" height="20" rx="10" fill="#1D9E75"/>
  <text x="717" y="556" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">L3</text>

  <rect x="790" y="530" width="290" height="150" rx="14" fill="#FAECE7" stroke="#D85A30"/>
  <text x="814" y="566" font-size="19" font-weight="600" fill="#712B13">Observability</text>
  <text x="814" y="598" font-size="14" fill="#993C1D">Prometheus · metrics</text>
  <text x="814" y="622" font-size="14" fill="#993C1D">Grafana · dashboards</text>
  <text x="814" y="646" font-size="14" fill="#993C1D">Alertmanager · alerts</text>
  <rect x="1022" y="542" width="46" height="20" rx="10" fill="#D85A30"/>
  <text x="1045" y="556" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">App</text>

  <rect x="620" y="710" width="300" height="130" rx="14" fill="#FAECE7" stroke="#D85A30"/>
  <text x="644" y="746" font-size="19" font-weight="600" fill="#712B13">Gallery Web</text>
  <text x="644" y="776" font-size="14" fill="#993C1D">Deployment + Service</text>
  <text x="644" y="800" font-size="14" fill="#993C1D">Exposed via Ingress → ALB</text>
  <text x="644" y="824" font-size="14" fill="#993C1D">Reads S3 via Pod Identity</text>
  <rect x="862" y="722" width="46" height="20" rx="10" fill="#D85A30"/>
  <text x="885" y="736" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">App</text>

  <!-- Arrows inside -->
  <line x1="185" y1="310" x2="185" y2="526" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="500" y1="310" x2="500" y2="526" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="455" y1="605" x2="414" y2="605" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="745" y1="605" x2="786" y2="605" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="650" y1="680" x2="650" y2="706" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="767" y1="444" x2="767" y2="706" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- Bottom row -->
  <rect x="120" y="940" width="290" height="80" rx="14" fill="#E6F1FB" stroke="#378ADD"/>
  <text x="144" y="973" font-size="18" font-weight="600" fill="#0C447C">S3 processed</text>
  <text x="144" y="998" font-size="14" fill="#185FA5">Resized · metadata stripped</text>
  <rect x="366" y="952" width="32" height="20" rx="10" fill="#378ADD"/>
  <text x="382" y="966" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">L1</text>

  <rect x="790" y="940" width="290" height="80" rx="14" fill="#F1EFE8" stroke="#B4B2A9"/>
  <text x="814" y="973" font-size="18" font-weight="600" fill="#2C2C2A">Email</text>
  <text x="814" y="998" font-size="14" fill="#5F5E5A">Alert on job failure</text>

  <line x1="265" y1="680" x2="265" y2="936" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ar)"/>
  <path d="M410 980 L700 980 L700 844" fill="none" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="560" y="970" font-size="13" fill="#5F5E5A" text-anchor="middle">serves images</text>
  <line x1="955" y1="680" x2="955" y2="936" stroke="#5F5E5A" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#ar)"/>

  <!-- Legend -->
  <line x1="60" y1="1052" x2="1140" y2="1052" stroke="#E5E3DC"/>
  <rect x="60" y="1074" width="18" height="18" rx="5" fill="#E6F1FB" stroke="#378ADD"/>
  <text x="86" y="1088" font-size="14" fill="#2C2C2A"><tspan font-weight="600">L1</tspan> Foundation · S3, ECR, IAM</text>
  <rect x="330" y="1074" width="18" height="18" rx="5" fill="#EEEDFE" stroke="#7F77DD"/>
  <text x="356" y="1088" font-size="14" fill="#2C2C2A"><tspan font-weight="600">L2</tspan> Cluster · VPC, EKS</text>
  <rect x="545" y="1074" width="18" height="18" rx="5" fill="#E1F5EE" stroke="#1D9E75"/>
  <text x="571" y="1088" font-size="14" fill="#2C2C2A"><tspan font-weight="600">L3</tspan> Bootstrap · Argo CD</text>
  <rect x="770" y="1074" width="18" height="18" rx="5" fill="#FAECE7" stroke="#D85A30"/>
  <text x="796" y="1088" font-size="14" fill="#2C2C2A"><tspan font-weight="600">App</tspan> · deployed by Argo CD</text>
  <rect x="1000" y="1074" width="18" height="18" rx="5" fill="#F1EFE8" stroke="#B4B2A9"/>
  <text x="1026" y="1088" font-size="14" fill="#2C2C2A">External</text>
