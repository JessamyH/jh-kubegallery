<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1120" viewBox="0 0 1200 1120" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1200" height="1120" fill="#FFFFFF"/>

  <text x="60" y="56" font-size="26" font-weight="600" fill="#1F1E1D">KubeGallery</text>
  <text x="60" y="84" font-size="15" fill="#5F5E5A">Media processing and gallery web on Amazon EKS · Terraform layers · GitOps with Argo CD</text>

  <!-- Row 1 -->
  <rect x="60" y="110" width="250" height="80" rx="14" fill="#F1EFE8" stroke="#B4B2A9"/>
  <text x="84" y="143" font-size="18" font-weight="600" fill="#2C2C2A">GitHub Actions</text>
  <text x="84" y="168" font-size="14" fill="#5F5E5A">Build images · bump chart tag</text>

  <rect x="360" y="110" width="230" height="80" rx="14" fill="#E6F1FB" stroke="#378ADD"/>
  <text x="384" y="143" font-size="18" font-weight="600" fill="#0C447C">Amazon ECR</text>
  <text x="384" y="168" font-size="14" fill="#185FA5">Job + web images</text>
  <rect x="546" y="122" width="32" height="20" rx="10" fill="#378ADD"/>
  <text x="562" y="136" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">L1</text>

  <rect x="880" y="110" width="260" height="80" rx="14" fill="#F1EFE8" stroke="#B4B2A9"/>
  <text x="904" y="143" font-size="18" font-weight="600" fill="#2C2C2A">Terraform</text>
  <text x="904" y="168" font-size="14" fill="#5F5E5A">Applies L1 → L2 → L3</text>

  <line x1="310" y1="150" x2="356" y2="150" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- Row 2 -->
  <rect x="60" y="230" width="250" height="80" rx="14" fill="#E6F1FB" stroke="#378ADD"/>
  <text x="84" y="263" font-size="18" font-weight="600" fill="#0C447C">S3 raw</text>
  <text x="84" y="288" font-size="14" fill="#185FA5">Sample media (input)</text>
  <rect x="266" y="242" width="32" height="20" rx="10" fill="#378ADD"/>
  <text x="282" y="256" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">L1</text>

  <rect x="360" y="230" width="230" height="80" rx="14" fill="#F1EFE8" stroke="#B4B2A9"/>
  <text x="384" y="263" font-size="18" font-weight="600" fill="#2C2C2A">Git repo</text>
  <text x="384" y="288" font-size="14" fill="#5F5E5A">Helm charts (GitOps)</text>

  <rect x="667" y="230" width="200" height="80" rx="14" fill="#F1EFE8" stroke="#B4B2A9"/>
  <text x="691" y="263" font-size="18" font-weight="600" fill="#2C2C2A">Users</text>
  <text x="691" y="288" font-size="14" fill="#5F5E5A">Browser</text>

  <path d="M260 190 L260 210 L500 210 L500 226" fill="none" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="1010" y1="190" x2="1010" y2="354" stroke="#5F5E5A" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#ar)"/>
  <text x="1022" y="280" font-size="13" fill="#5F5E5A">provisions</text>

